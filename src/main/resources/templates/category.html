<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Kategorie - MemoryBook</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div th:replace="~{index :: nav}"></div>

<div class="container">
  <div class="card shadow-sm">
    <div class="card-body">
      <h3 class="card-title" th:text="${category.name}">Kategorie</h3>
      <p class="text-muted mb-0">ID: <span th:text="${category.id}">1</span></p>
    </div>
  </div>
  <a href="/categories" class="btn btn-secondary mt-4">Zurück zu den Kategorien</a>
</div>

</body>
</html>
