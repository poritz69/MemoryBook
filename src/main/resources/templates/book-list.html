<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MemoryBook - Booklist</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">MemoryBook</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/books">Books</a></li>
                <li class="nav-item"><a class="nav-link" href="/categories">Categories</a></li>
                <li class="nav-item"><a class="nav-link active" href="/profile">Profil</a></li>
            </ul>
        </div>
    </div>
</nav>


<div class="container">
    <div class="row mb-3">
        <div class="col-md-8">
            <h2>Alle Bücher</h2>
        </div>
        <div class="col-md-4 text-end">
            <a href="/books/add" class="btn btn-primary">+ Neues Buch hinzufügen</a>
        </div>
    </div>


    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-striped align-middle">
                <thead>
                <tr>
                    <th>Titel</th>
                    <th>Favorit</th>
                    <th>Aktionen</th>
                </tr>
                </thead>
                <tbody>
                <!-- Schleife über die Bücher-Liste aus dem BookController -->
                <tr th:each="book : ${books}">
                    <td th:text="${book.title}">Buchtitel</td>
                    <td>
                        <!-- Favoriten-Status umschalten -->
                        <form th:action="@{/books/favorite/{id}(id=${book.id})}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm"
                                    th:classappend="${book.favorite} ? 'btn-warning' : 'btn-outline-secondary'"
                                    th:text="${book.favorite} ? '★ Favorit' : '☆ Keiner'">Favorit</button>
                        </form>
                    </td>
                    <td>
                        <a th:href="@{/books/{id}/notes(id=${book.id})}" class="btn btn-sm btn-outline-primary">Notizen</a>
                        <form th:action="@{/books/delete/{id}(id=${book.id})}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Löschen</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${books == null or books.empty}">
                    <td colspan="3" class="text-center text-muted">Keine Bücher gefunden. Füge dein erstes hinzu!</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
