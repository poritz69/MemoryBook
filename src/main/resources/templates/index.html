<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>MemoryBook - Startseite</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<nav th:replace="~{fragments :: nav}"></nav>

<div class="container">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Hallo, <span th:text="${user.username}">Name</span>!</h2>
    <a href="/books/add" class="btn btn-primary">+ Neues Buch</a>
  </div>

  <!-- Zahlen -->
  <div class="row mb-4">
    <div class="col-md-2 col-6 mb-3">
      <div class="card shadow-sm"><div class="card-body">
        <div class="text-muted small">Bücher</div>
        <h3 th:text="${totalBooks}">0</h3>
      </div></div>
    </div>
    <div class="col-md-2 col-6 mb-3" th:each="entry : ${statusCounts}">
      <div class="card shadow-sm"><div class="card-body">
        <div class="text-muted small" th:text="${entry.key.label}">Status</div>
        <h3 th:text="${entry.value}">0</h3>
      </div></div>
    </div>
    <div class="col-md-2 col-6 mb-3">
      <div class="card shadow-sm"><div class="card-body">
        <div class="text-muted small">Favoriten</div>
        <h3 th:text="${favorites}">0</h3>
      </div></div>
    </div>
  </div>

  <div class="row">
    <div class="col-md-8">
      <!-- Bücher die man gerade liest -->
      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <h5 class="card-title">Lese ich gerade</h5>
          <p th:if="${reading.empty}" class="text-muted">Gerade liest du kein Buch.</p>
          <div th:each="book : ${reading}" class="mb-3">
            <a th:href="@{/books/{id}(id=${book.id})}" th:text="${book.title}">Titel</a>
            <span class="text-muted" th:text="${book.author}"></span>
            <div class="progress mt-1">
              <div class="progress-bar" th:style="'width:' + ${book.progressPercent} + '%'"
                   th:text="${book.progressPercent} + ' %'"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Neueste Notizen -->
      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <h5 class="card-title">Neueste Notizen</h5>
          <p th:if="${recentNotes.empty}" class="text-muted">Noch keine Notizen.</p>
          <ul class="list-group list-group-flush">
            <li class="list-group-item" th:each="note : ${recentNotes}">
              <span th:text="${note.content}">Notiz</span><br>
              <small class="text-muted">
                <a th:href="@{/books/{id}(id=${note.book.id})}" th:text="${note.book.title}">Buch</a>
                <span th:if="${note.page != null}" th:text="', Seite ' + ${note.page}"></span>
              </small>
            </li>
          </ul>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <!-- Jahresziel -->
      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <h5 class="card-title">Jahresziel</h5>
          <p><span th:text="${finishedThisYear}">0</span> von <span th:text="${user.readingGoal}">12</span> Büchern gelesen</p>
          <div class="progress">
            <div class="progress-bar bg-success" th:style="'width:' + ${goalPercent} + '%'"
                 th:text="${goalPercent} + ' %'"></div>
          </div>
          <p class="mt-3 mb-0 small text-muted">Gelesene Seiten: <span th:text="${pagesRead}">0</span>,
            Notizen: <span th:text="${noteCount}">0</span></p>
        </div>
      </div>

      <!-- Zuletzt hinzugefügt -->
      <div class="card shadow-sm">
        <div class="card-body">
          <h5 class="card-title">Zuletzt hinzugefügt</h5>
          <p th:if="${recentBooks.empty}" class="text-muted">Noch keine Bücher.</p>
          <ul class="list-unstyled mb-0">
            <li th:each="book : ${recentBooks}">
              <a th:href="@{/books/{id}(id=${book.id})}" th:text="${book.title}">Titel</a>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
