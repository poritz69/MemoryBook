<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Login - MemoryBook</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width: 420px">
  <h2 class="text-center mb-4">MemoryBook</h2>

  <div th:if="${param.error}" class="alert alert-danger">Benutzername oder Passwort falsch.</div>
  <div th:if="${param.logout}" class="alert alert-success">Du wurdest abgemeldet.</div>
  <div th:if="${param.registered}" class="alert alert-success">Konto angelegt, du kannst dich jetzt einloggen.</div>
  <div th:if="${param.deleted}" class="alert alert-info">Dein Konto wurde gelöscht.</div>

  <div class="card shadow-sm">
    <div class="card-body">
      <h4 class="card-title mb-3">Einloggen</h4>
      <form th:action="@{/login}" method="post">
        <div class="mb-3">
          <label class="form-label">Name</label>
          <input type="text" name="username" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Passwort</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Log in</button>
      </form>
    </div>
  </div>

  <p class="text-center mt-3">Noch kein Konto? <a href="/users">Hier registrieren</a></p>
</div>

</body>
</html>
