<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Login - MemoryBook</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<main class="container mt-5" style="max-width: 420px">

  <div th:if="${param.error}" class="alert alert-danger">Benutzername oder Passwort falsch.</div>
  <div th:if="${param.logout}" class="alert alert-success">Du wurdest abgemeldet.</div>

  <h2 class="text-center mb-4">Einloggen</h2>
  <!-- th:action fügt das CSRF-Token automatisch ein -->
  <form th:action="@{/login}" method="post">
    <div class="mb-3">
      <label for="username" class="form-label">Name</label>
      <input type="text" id="username" name="username" class="form-control" required>
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Passwort</label>
      <input type="password" id="password" name="password" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">Log in</button>
  </form>

  <hr class="my-4">

  <p class="text-center">Noch kein Konto? <a th:href="@{/users}">Hier registrieren</a></p>

  <footer class="text-center text-muted mt-5">
    <p>MemoryBook Save instead of Forgetting</p>
  </footer>
</main>
</body>
</html>
