<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Kategorie - MemoryBook</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<nav th:replace="~{fragments :: nav}"></nav>

<div class="container">
  <div th:replace="~{fragments :: messages}"></div>

  <a href="/categories">← Alle Kategorien</a>
  <h2 class="mt-2 mb-4" th:text="${category.name}">Kategorie</h2>

  <div class="row">
    <div class="col-md-8 mb-4">
      <div class="card shadow-sm">
        <div class="card-body">
          <h5 class="card-title">Bücher in dieser Kategorie</h5>
          <p th:if="${category.books.empty}" class="text-muted">
            Noch keine Bücher. Kategorien ordnet man beim Bearbeiten eines Buches zu.
          </p>
          <ul class="list-group list-group-flush">
            <li class="list-group-item" th:each="book : ${category.books}">
              <a th:href="@{/books/{id}(id=${book.id})}" th:text="${book.title}">Titel</a>
              <span class="text-muted" th:text="${book.author}"></span>
            </li>
          </ul>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card shadow-sm mb-3">
        <div class="card-body">
          <h5 class="card-title">Umbenennen</h5>
          <form th:action="@{/categories/rename/{id}(id=${category.id})}" method="post">
            <input type="text" name="name" class="form-control mb-2" th:value="${category.name}" required>
            <button type="submit" class="btn btn-outline-primary w-100">Speichern</button>
          </form>
        </div>
      </div>

      <form th:action="@{/categories/delete/{id}(id=${category.id})}" method="post"
            onsubmit="return confirm('Kategorie löschen? Die Bücher bleiben erhalten.')">
        <button type="submit" class="btn btn-outline-danger w-100">Kategorie löschen</button>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
