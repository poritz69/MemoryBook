<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Neues Buch - MemoryBook</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="/">MemoryBook</a>
  </div>
</nav>

<!-- Formular-Container -->
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-body">
          <h3 class="card-title mb-4">Neues Buch hinzufügen</h3>

          <!-- Wichtig: action zeigt auf /books/save laut deinem Controller -->
          <form action="#" th:action="@{/books/save}" th:object="${book}" method="post">

            <div class="mb-3">
              <label for="title" class="form-label">Buchtitel</label>
              <input type="text" id="title" th:field="*{title}" class="form-control" required placeholder="Gib einen Titel ein...">
            </div>

            <!-- Falls deine Book Entity noch weitere Felder hat (z.B. description), kannst du sie hier ergänzen -->

            <div class="d-flex justify-content-between">
              <a href="/books" class="btn btn-secondary">Abbrechen</a>
              <button type="submit" class="btn btn-success">Speichern</button>
            </div>

          </form>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
