<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Notizen - MemoryBook</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div th:replace="~{index :: nav}"></div>

<div class="container">
  <h2 class="mb-4">Notizen zu <span th:text="${book.title}">Buchtitel</span></h2>

  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <form th:action="@{/books/{id}/notes/save(id=${book.id})}" method="post">
        <div class="mb-3">
          <label for="content" class="form-label">Neue Notiz</label>
          <textarea id="content" name="content" class="form-control" rows="3" required></textarea>
        </div>
        <button type="submit" class="btn btn-success">Notiz speichern</button>
      </form>
    </div>
  </div>

  <div class="card shadow-sm">
    <div class="card-body">
      <table class="table table-striped align-middle mb-0">
        <thead>
        <tr>
          <th>Datum</th>
          <th>Notiz</th>
          <th>Von</th>
          <th class="text-end">Aktion</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="note : ${notes}">
          <td th:text="${note.date}">2026-01-01</td>
          <td th:text="${note.content}">Inhalt</td>
          <td th:text="${note.appuser?.username}">Name</td>
          <td class="text-end">
            <form th:action="@{/notes/delete/{id}(id=${note.id}, bookId=${book.id})}" method="post" class="d-inline">
              <button type="submit" class="btn btn-sm btn-outline-danger">Löschen</button>
            </form>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(notes)}">
          <td colspan="4" class="text-center text-muted">Noch keine Notizen.</td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

  <a href="/books" class="btn btn-secondary mt-4">Zurück zu den Büchern</a>
</div>

</body>
</html>
