<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Notizen - MemoryBook</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<nav th:replace="~{fragments :: nav}"></nav>

<div class="container">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Alle Notizen</h2>
    <form action="/notes" method="get" class="d-flex gap-2">
      <input type="text" name="q" class="form-control" th:value="${q}" placeholder="In Notizen suchen">
      <button type="submit" class="btn btn-dark">Suchen</button>
    </form>
  </div>

  <p th:if="${notes.empty}" class="text-muted">Keine Notizen gefunden.</p>

  <div class="row">
    <div class="col-md-6 mb-3" th:each="note : ${notes}">
      <div class="card shadow-sm h-100">
        <div class="card-body">
          <p th:text="${note.content}" style="white-space: pre-line">Notiz</p>
          <small class="text-muted">
            <a th:href="@{/books/{id}(id=${note.book.id})}" th:text="${note.book.title}">Buch</a>
            <span th:if="${note.page != null}" th:text="', Seite ' + ${note.page}"></span>
            <span th:text="', ' + ${#temporals.format(note.createdAt, 'dd.MM.yyyy')}"></span>
          </small>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
