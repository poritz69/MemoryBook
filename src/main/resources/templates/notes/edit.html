<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Notiz bearbeiten - MemoryBook</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<nav th:replace="~{fragments :: nav}"></nav>

<div class="container">
  <div th:replace="~{fragments :: messages}"></div>

  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-body">
          <h3 class="card-title mb-1">Notiz bearbeiten</h3>
          <p class="text-muted" th:text="${note.book.title}">Buch</p>

          <form th:action="@{/notes/update/{id}(id=${note.id})}" method="post">
            <div class="mb-3">
              <label class="form-label">Notiz</label>
              <textarea name="content" class="form-control" rows="5" th:text="${note.content}" required></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label">Seite</label>
              <input type="number" name="page" class="form-control" min="1" th:value="${note.page}">
            </div>
            <div class="d-flex justify-content-between">
              <a th:href="@{/books/{id}(id=${note.book.id})}" class="btn btn-secondary">Abbrechen</a>
              <button type="submit" class="btn btn-success">Speichern</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
