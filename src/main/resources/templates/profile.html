<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>profile - MemoryBook</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">


<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="/">MemoryBook</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/books">Books</a></li>
        <li class="nav-item"><a class="nav-link" href="/categories">Categories</a></li>
        <li class="nav-item"><a class="nav-link active" href="/profile">Profil</a></li>
      </ul>
    </div>
  </div>
</nav>


<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-body">
          <h3 class="card-title mb-4">Dein Benutzerprofil</h3>

          <div class="mb-3">
            <label class="form-label text-muted">Benutzer-ID</label>
            <p class="form-control-static fw-bold" th:text="${user.id}">1</p>
          </div>

          <div class="mb-3">
            <label class="form-label text-muted">Benutzername</label>
            <p class="form-control-static fw-bold" th:text="${user.username}">DeinName</p>
          </div>

          <div class="d-flex justify-content-between mt-4">
            <a href="/" class="btn btn-secondary">back to startsite</a>

            <form th:action="@{/logout}" method="post" class="m-0">
              <button type="submit" class="btn btn-danger">Abmelden</button>
            </form>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
