<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Profil - MemoryBook</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<nav th:replace="~{fragments :: nav}"></nav>

<div class="container">
  <div th:replace="~{fragments :: messages}"></div>

  <div class="row">
    <div class="col-md-6">
      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <h3 class="card-title mb-4">Dein Benutzerprofil</h3>
          <table class="table mb-0">
            <tr><th>Benutzer-ID</th><td th:text="${user.id}">1</td></tr>
            <tr><th>Benutzername</th><td th:text="${user.username}">Name</td></tr>
            <tr><th>Bücher</th><td th:text="${totalBooks}">0</td></tr>
            <tr><th>Gelesen</th><td th:text="${readBooks}">0</td></tr>
            <tr><th>Gelesene Seiten</th><td th:text="${pagesRead}">0</td></tr>
            <tr><th>Notizen</th><td th:text="${noteCount}">0</td></tr>
          </table>
        </div>
      </div>

      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <h5 class="card-title">Jahresziel</h5>
          <p>Dieses Jahr <span th:text="${finishedThisYear}">0</span> von <span th:text="${user.readingGoal}">12</span> Büchern gelesen.</p>
          <form th:action="@{/profile/goal}" method="post" class="d-flex gap-2">
            <input type="number" name="readingGoal" class="form-control" min="1" max="365"
                   th:value="${user.readingGoal}" required>
            <button type="submit" class="btn btn-outline-primary">Speichern</button>
          </form>
        </div>
      </div>
    </div>

    <div class="col-md-6">
      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <h5 class="card-title">Passwort ändern</h5>
          <form th:action="@{/profile/password}" method="post">
            <div class="mb-2">
              <label class="form-label">Aktuelles Passwort</label>
              <input type="password" name="oldPassword" class="form-control" required>
            </div>
            <div class="mb-2">
              <label class="form-label">Neues Passwort</label>
              <input type="password" name="newPassword" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Neues Passwort wiederholen</label>
              <input type="password" name="newPasswordRepeat" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary">Passwort ändern</button>
          </form>
        </div>
      </div>

      <div class="card shadow-sm border-danger">
        <div class="card-body">
          <h5 class="card-title text-danger">Konto löschen</h5>
          <p class="small text-muted">Löscht dein Konto mit allen Büchern, Kategorien und Notizen.</p>
          <form th:action="@{/profile/delete}" method="post" onsubmit="return confirm('Konto wirklich löschen?')">
            <div class="mb-2">
              <label class="form-label">Passwort zur Bestätigung</label>
              <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-danger">Konto löschen</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div class="d-flex justify-content-between mt-4">
    <a href="/" class="btn btn-secondary">Zurück zur Startseite</a>
    <form th:action="@{/logout}" method="post" class="m-0">
      <button type="submit" class="btn btn-danger">Abmelden</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
