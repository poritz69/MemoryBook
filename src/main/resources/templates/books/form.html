<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Buch - MemoryBook</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<nav th:replace="~{fragments :: nav}"></nav>

<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow-sm">
        <div class="card-body">
          <h3 class="card-title mb-4" th:text="${book.id == null} ? 'Neues Buch hinzufügen' : 'Buch bearbeiten'">Buch</h3>

          <!-- Gleiches Formular für neu und bearbeiten, die id steht im versteckten Feld -->
          <form th:action="@{/books/save}" th:object="${book}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="row">
              <div class="col-md-8 mb-3">
                <label class="form-label">Titel *</label>
                <input type="text" th:field="*{title}" class="form-control" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{title}"></div>
              </div>
              <div class="col-md-4 mb-3">
                <label class="form-label">ISBN</label>
                <input type="text" th:field="*{isbn}" class="form-control">
              </div>
              <div class="col-md-8 mb-3">
                <label class="form-label">Autor</label>
                <input type="text" th:field="*{author}" class="form-control">
              </div>
              <div class="col-md-4 mb-3">
                <label class="form-label">Seiten</label>
                <input type="number" th:field="*{pages}" class="form-control" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{pages}"></div>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Beschreibung</label>
              <textarea th:field="*{description}" class="form-control" rows="3" th:errorclass="is-invalid"></textarea>
              <div class="invalid-feedback" th:errors="*{description}"></div>
            </div>

            <div class="row">
              <div class="col-md-4 mb-3">
                <label class="form-label">Status</label>
                <select th:field="*{status}" class="form-select">
                  <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.label}"></option>
                </select>
              </div>
              <div class="col-md-4 mb-3">
                <label class="form-label">Aktuelle Seite</label>
                <input type="number" th:field="*{currentPage}" class="form-control" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{currentPage}"></div>
              </div>
              <div class="col-md-4 mb-3">
                <label class="form-label">Bewertung</label>
                <select th:field="*{rating}" class="form-select">
                  <option value="">Keine</option>
                  <option value="1">★</option>
                  <option value="2">★★</option>
                  <option value="3">★★★</option>
                  <option value="4">★★★★</option>
                  <option value="5">★★★★★</option>
                </select>
              </div>
              <div class="col-md-4 mb-3">
                <label class="form-label">Begonnen am</label>
                <input type="date" th:field="*{startedOn}" class="form-control">
              </div>
              <div class="col-md-4 mb-3">
                <label class="form-label">Beendet am</label>
                <input type="date" th:field="*{finishedOn}" class="form-control">
              </div>
              <div class="col-md-4 mb-3 d-flex align-items-end">
                <div class="form-check">
                  <input type="checkbox" th:field="*{favorite}" class="form-check-input">
                  <label class="form-check-label">Favorit</label>
                </div>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label d-block">Kategorien</label>
              <span th:if="${categories.empty}" class="text-muted">Noch keine Kategorien. <a href="/categories">Anlegen</a></span>
              <div class="form-check form-check-inline" th:each="c : ${categories}">
                <input type="checkbox" name="categoryIds" class="form-check-input" th:id="'cat' + ${c.id}"
                       th:value="${c.id}" th:checked="${selectedCategories.contains(c.id)}">
                <label class="form-check-label" th:for="'cat' + ${c.id}" th:text="${c.name}">Kategorie</label>
              </div>
            </div>

            <div class="d-flex justify-content-between">
              <a th:href="${book.id == null} ? '/books' : '/books/' + ${book.id}" class="btn btn-secondary">Abbrechen</a>
              <button type="submit" class="btn btn-success">Speichern</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
