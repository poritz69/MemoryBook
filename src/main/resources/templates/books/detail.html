<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${book.title} + ' - MemoryBook'">Buch - MemoryBook</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<nav th:replace="~{fragments :: nav}"></nav>

<div class="container">
  <div th:replace="~{fragments :: messages}"></div>

  <a href="/books">← Alle Bücher</a>

  <div class="card shadow-sm mt-2 mb-4">
    <div class="card-body">
      <div class="row">
        <div class="col-md-2" th:if="${book.coverUrl != null}">
          <img th:src="${book.coverUrl}" alt="Cover" class="img-fluid rounded" onerror="this.remove()">
        </div>
        <div class="col">
          <h3>
            <span th:text="${book.title}">Titel</span>
            <span th:if="${book.favorite}" class="text-warning">★</span>
          </h3>
          <p class="text-muted" th:text="${book.author}">Autor</p>
          <p>
            <span th:if="${book.status != null}" class="badge" th:classappend="'bg-' + ${book.status.color}"
                  th:text="${book.status.label}">Status</span>
            <span class="badge bg-light text-dark border" th:each="c : ${book.categories}" th:text="${c.name}">Kategorie</span>
            <span class="text-warning" th:if="${book.rating != null}" th:text="${#strings.repeat('★', book.rating)}"></span>
          </p>
          <p th:if="${book.description != null}" th:text="${book.description}">Beschreibung</p>

          <table class="table table-sm w-auto">
            <tr><th>Seiten</th><td th:text="${book.pages}"></td></tr>
            <tr><th>ISBN</th><td th:text="${book.isbn}"></td></tr>
            <tr><th>Begonnen</th><td th:text="${book.startedOn != null} ? ${#temporals.format(book.startedOn, 'dd.MM.yyyy')} : ''"></td></tr>
            <tr><th>Beendet</th><td th:text="${book.finishedOn != null} ? ${#temporals.format(book.finishedOn, 'dd.MM.yyyy')} : ''"></td></tr>
          </table>

          <div class="d-flex gap-2">
            <a th:href="@{/books/edit/{id}(id=${book.id})}" class="btn btn-outline-primary btn-sm">Bearbeiten</a>
            <form th:action="@{/books/favorite/{id}(id=${book.id})}" method="post">
              <button type="submit" class="btn btn-outline-warning btn-sm"
                      th:text="${book.favorite} ? 'Kein Favorit mehr' : 'Als Favorit'">Favorit</button>
            </form>
            <form th:action="@{/books/delete/{id}(id=${book.id})}" method="post"
                  onsubmit="return confirm('Buch und alle Notizen löschen?')">
              <button type="submit" class="btn btn-outline-danger btn-sm">Löschen</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Fortschritt -->
  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <h5 class="card-title">Fortschritt: <span th:text="${book.progressPercent} + ' %'">0 %</span></h5>
      <div class="progress mb-3">
        <div class="progress-bar bg-success" th:style="'width:' + ${book.progressPercent} + '%'"></div>
      </div>
      <form th:action="@{/books/progress/{id}(id=${book.id})}" method="post" class="d-flex gap-2 align-items-center">
        <label>Ich bin auf Seite</label>
        <input type="number" name="currentPage" class="form-control" style="width: 120px" min="0"
               th:value="${book.currentPage ?: 0}" required>
        <span th:if="${book.pages != null}" th:text="'von ' + ${book.pages}"></span>
        <button type="submit" class="btn btn-success btn-sm">Speichern</button>
      </form>
    </div>
  </div>

  <!-- Notizen -->
  <div class="card shadow-sm">
    <div class="card-body">
      <h5 class="card-title">Notizen</h5>
      <form th:action="@{/books/{id}/notes/save(id=${book.id})}" method="post" class="mb-3">
        <textarea name="content" class="form-control mb-2" rows="2" placeholder="Neue Notiz ..." required></textarea>
        <div class="d-flex gap-2">
          <input type="number" name="page" class="form-control" style="width: 120px" min="1" placeholder="Seite">
          <button type="submit" class="btn btn-primary">Notiz speichern</button>
        </div>
      </form>

      <p th:if="${book.notes.empty}" class="text-muted">Noch keine Notizen zu diesem Buch.</p>
      <ul class="list-group">
        <li class="list-group-item" th:each="note : ${book.notes}">
          <div th:text="${note.content}" style="white-space: pre-line">Notiz</div>
          <div class="d-flex justify-content-between small text-muted mt-1">
            <span>
              <span th:text="${#temporals.format(note.createdAt, 'dd.MM.yyyy HH:mm')}"></span>
              <span th:if="${note.page != null}" th:text="', Seite ' + ${note.page}"></span>
            </span>
            <div class="d-flex gap-2">
              <a th:href="@{/notes/edit/{id}(id=${note.id})}">Bearbeiten</a>
              <form th:action="@{/notes/delete/{id}(id=${note.id})}" method="post" onsubmit="return confirm('Notiz löschen?')">
                <button type="submit" class="btn btn-link btn-sm p-0 text-danger">Löschen</button>
              </form>
            </div>
          </div>
        </li>
      </ul>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
