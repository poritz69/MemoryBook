<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Navigation für alle Seiten, einbinden mit th:replace="~{fragments :: nav}" -->
<nav th:fragment="nav" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="/">MemoryBook</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/books">Bücher</a></li>
        <li class="nav-item"><a class="nav-link" href="/categories">Kategorien</a></li>
        <li class="nav-item"><a class="nav-link" href="/notes">Notizen</a></li>
      </ul>
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="/profile">Profil</a></li>
        <li class="nav-item">
          <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-link nav-link">Abmelden</button>
          </form>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- Erfolgs- und Fehlermeldungen -->
<div th:fragment="messages">
  <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
</div>

</body>
</html>
