<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Registrierung - MemoryBook</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width: 420px">
  <h2 class="text-center mb-4">MemoryBook</h2>

  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

  <div class="card shadow-sm">
    <div class="card-body">
      <h4 class="card-title mb-3">Registrierung</h4>
      <form th:action="@{/saveUser}" method="post">
        <div class="mb-3">
          <label class="form-label">Name</label>
          <input type="text" name="username" class="form-control" th:value="${username}" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Passwort</label>
          <input type="password" name="password" class="form-control" required>
          <div class="form-text">Mindestens 8 Zeichen.</div>
        </div>
        <div class="mb-3">
          <label class="form-label">Passwort wiederholen</label>
          <input type="password" name="passwordRepeat" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Registrieren</button>
      </form>
    </div>
  </div>

  <p class="text-center mt-3">Schon ein Konto? <a href="/login">Zum Login</a></p>
</div>

</body>
</html>
