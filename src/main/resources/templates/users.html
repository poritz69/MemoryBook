<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Registrierung - MemoryBook</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<main class="container mt-5" style="max-width: 420px">

  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
  <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

  <h2 class="text-center mb-4">Registrierung</h2>
  <form th:action="@{/saveUser}" method="post">
    <div class="mb-3">
      <label for="username" class="form-label">Name</label>
      <input type="text" id="username" name="username" class="form-control" required>
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Passwort</label>
      <input type="password" id="password" name="password" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">Registrieren</button>
  </form>

  <hr class="my-4">

  <p class="text-center">Schon ein Konto? <a th:href="@{/login}">Zum Login</a></p>

  <footer class="text-center text-muted mt-5">
    <p>MemoryBook Save instead of Forgetting</p>
  </footer>
</main>
</body>
</html>
